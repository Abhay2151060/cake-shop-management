{% extends "base.html" %}

{% block title %}Shop Settings - {{ settings.shop_name }}{% endblock %}
{% block page_title %}Shop Profile & System Settings{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
  <div class="card-panel">
    <div class="card-panel-header">
      <div class="card-panel-title">
        <svg style="width: 20px; height: 20px; color: var(--primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Shop Configuration & Branding
      </div>
    </div>
    <div class="card-panel-body">
      <form action="/settings/update" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="shop_name">Shop Name *</label>
            <input type="text" id="shop_name" name="shop_name" class="form-control" value="{{ settings.shop_name or '' }}" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="shop_tagline">Shop Tagline</label>
            <input type="text" id="shop_tagline" name="shop_tagline" class="form-control" value="{{ settings.shop_tagline or '' }}">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="shop_address">Store Physical Address *</label>
          <textarea id="shop_address" name="shop_address" class="form-control" rows="2" required>{{ settings.shop_address or '' }}</textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="shop_phone">Contact Phone Number *</label>
            <input type="text" id="shop_phone" name="shop_phone" class="form-control" value="{{ settings.shop_phone or '' }}" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="shop_email">Store Email Address *</label>
            <input type="email" id="shop_email" name="shop_email" class="form-control" value="{{ settings.shop_email or '' }}" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="shop_gstin">GST / Tax Identification Number</label>
            <input type="text" id="shop_gstin" name="shop_gstin" class="form-control" value="{{ settings.shop_gstin or '' }}">
          </div>
          <div class="form-group">
            <label class="form-label" for="currency_symbol">Currency Symbol</label>
            <input type="text" id="currency_symbol" name="currency_symbol" class="form-control" value="{{ settings.currency_symbol or '₹' }}" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="receipt_footer">Invoice / Receipt Footer Note</label>
          <input type="text" id="receipt_footer" name="receipt_footer" class="form-control" value="{{ settings.receipt_footer or '' }}">
        </div>


        <div style="margin-top: 24px;">
          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; font-weight: 700;">
            Save Settings & Branding
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
